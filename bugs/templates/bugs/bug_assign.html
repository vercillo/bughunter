<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugHunter | Assign Bug</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #f5f7fb;
            color: #172b4d;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(23, 43, 77, 0.04);
        }

        h1 { margin-top: 0; font-size: 26px; }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
        }

        .bug-title {
            margin: 20px 0;
            padding: 14px;
            background: #f5f7fb;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .primary { background: #1769f5; color: white; }
        .secondary { background: #eef2f7; color: #334155; }
        .errorlist { color: #b91c1c; }
    </style>
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Assign Bug</h1>
            <p class="subtitle">
                Choose a Tech Team member to take ownership of this bug.
            </p>

            <div class="bug-title">
                <strong>{{ bug.title }}</strong>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.assigned_to.errors }}

                <label for="{{ form.assigned_to.id_for_label }}">
                    Assign to
                </label>

                {{ form.assigned_to }}

                <div class="actions">
                    <button type="submit" class="button primary">
                        Save Assignment
                    </button>

                    <a class="button secondary"
                       href="{% url 'bug_detail' bug.id %}">
                        Cancel
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
