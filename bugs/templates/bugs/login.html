<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | BugHunter</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 18px;
            background:
                radial-gradient(ellipse at top left, #e0eaff 0%, transparent 45%),
                #f5f7fc;
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            color: #17233d;
        }

        .card {
            width: min(460px, 100%);
            padding: 38px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e8edf5;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(28, 46, 85, 0.09);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin-bottom: 32px;
            text-decoration: none;
            cursor: pointer;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 13px;
            background: #101b35;
            color: white;
            font-size: 23px;
            box-shadow: 0 6px 16px rgba(49, 107, 250, 0.25);
        }

        .brand-name {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #101b35;
            transition: color 0.2s;
        }

        .brand:hover {
            text-decoration: none;
        }

        .brand:hover .brand-name {
            color: #316bfa;
        }

        h1 {
            margin: 0;
            font-size: 29px;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .subtitle {
            margin: 12px 0 28px;
            color: #78849a;
            font-size: 14px;
            line-height: 1.6;
        }

        .errors {
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 10px;
            background: #fff1f2;
            color: #b42318;
            font-size: 13px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 19px 0 8px;
            color: #34415a;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            border: 1px solid #dce3ef;
            border-radius: 10px;
            outline: none;
            background: #fbfcff;
            color: #17233d;
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #477cff;
            box-shadow: 0 0 0 4px rgba(49, 107, 250, 0.10);
            background: white;
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 26px;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #477cff, #3161e8);
            color: white;
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 7px 16px rgba(49, 107, 250, 0.20);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(49, 107, 250, 0.28);
        }

        .bottom {
            margin-top: 25px;
            text-align: center;
            color: #78849a;
            font-size: 13px;
        }

        .bottom a {
            color: #316bfa;
            font-weight: 700;
            text-decoration: none;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
                border-radius: 16px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <main class="card">

        <a href="{% url 'landing' %}" class="brand"
           aria-label="BugHunter home">
            <span class="brand-icon">
                <i class="bi bi-bug-fill" aria-hidden="true"></i>
            </span>
            <span class="brand-name">BugHunter</span>
        </a>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Log in to your BugHunter account.
        </p>

        {% if form.errors %}
            <div class="errors">
                Your username or password is incorrect.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="{{ form.username.id_for_label }}">
                Username
            </label>
            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">
                Password
            </label>
            {{ form.password }}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit">Log in →</button>
        </form>

        <div class="bottom">
            Don't have an account?
            <a href="{% url 'register' %}">Create one</a>
        </div>

    </main>
</body>
</html>
