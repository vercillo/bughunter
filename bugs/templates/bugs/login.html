
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | BugHunter</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #17233d;
        }

        .card {
            width: min(420px, calc(100% - 40px));
            box-sizing: border-box;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(20, 35, 65, 0.08);
        }

        h1 { margin-top: 0; }
        p { color: #68758b; }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #d8dfeb;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #316bfa;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .errors { color: #c62828; }
        .bottom { margin-top: 20px; font-size: 14px; }
        a { color: #316bfa; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Welcome back</h1>
        <p>Log in to your BugHunter account.</p>

        {% if form.errors %}
            <p class="errors">Your username or password is incorrect.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit">Log in</button>
        </form>

        <div class="bottom">
            Don't have an account?
            <a href="{% url 'register' %}">Create one</a>
        </div>
    </main>
</body>
</html>
